name: hr_attendance_app
description: "شؤون العاملين — HR Attendance Flutter app (Clean Architecture + Cubit)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # Networking
  dio: ^5.4.3+1

  # Utilities
  intl: ^0.20.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^11.0.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
